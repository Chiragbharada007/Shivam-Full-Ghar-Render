<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B32"/>
      <stop offset="50%" stop-color="#800020"/>
      <stop offset="100%" stop-color="#4A0404"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="36" fill="url(#roseGrad)" filter="url(#iconShadow)"/>
  <rect x="7" y="7" width="114" height="114" rx="33" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Sacred Royal Lotus / Rose Floral Blossom -->
  <g transform="translate(64, 64) scale(1.15)">
    <!-- Central Main Petal -->
    <path d="M 0,-34 C 16,-18 18,12 0,28 C -18,12 -16,-18 0,-34 Z" fill="url(#goldGrad)"/>
    <!-- Left Petal Layer -->
    <path d="M -8,-24 C -30,-12 -32,18 -4,26 C -8,14 -8,-4 -8,-24 Z" fill="#FBF2C0" opacity="0.95"/>
    <!-- Right Petal Layer -->
    <path d="M 8,-24 C 30,-12 32,18 4,26 C 8,14 8,-4 8,-24 Z" fill="#FBF2C0" opacity="0.95"/>
    <!-- Bottom Flourish Leaves -->
    <path d="M -24,8 C -34,26 -16,36 0,32 C 16,36 34,26 24,8 C 12,22 -12,22 -24,8 Z" fill="url(#goldGrad)"/>
    <!-- Center Jewel Dot -->
    <circle cx="0" cy="2" r="5" fill="#9E1B32"/>
    <circle cx="0" cy="2" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
